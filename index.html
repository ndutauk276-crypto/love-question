```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Before We Name It ❤️</title>

    <style>
        /* =========================
           BASIC SETUP
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(circle at center,
                    #3b0715 0%,
                    #18030a 45%,
                    #050105 100%);

            color: white;
        }


        /* =========================
           BACKGROUND GLOW
        ========================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(180, 0, 45, 0.20),
                    transparent 55%
                );

            pointer-events: none;
        }


        /* =========================
           LARGE HEART
        ========================== */

        .big-heart {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            font-size: min(75vw, 650px);

            color: rgba(180, 0, 40, 0.10);

            text-shadow:
                0 0 40px rgba(255, 0, 70, 0.15),
                0 0 100px rgba(255, 0, 70, 0.12);

            animation: heartPulse 3s infinite ease-in-out;

            z-index: 0;

            user-select: none;
        }


        @keyframes heartPulse {

            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.08);
            }
        }


        /* =========================
           MAIN CONTENT
        ========================== */

        .container {
            position: relative;

            z-index: 10;

            width: min(90%, 750px);

            text-align: center;

            padding: 30px;
        }


        /* =========================
           SMALL INTRO
        ========================== */

        .intro {
            font-size: 14px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: rgba(255, 190, 205, 0.75);

            margin-bottom: 30px;

            opacity: 0;

            animation: fadeIn 2s ease forwards;
        }


        /* =========================
           QUESTION
        ========================== */

        .question {
            min-height: 180px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: clamp(28px, 5vw, 55px);

            line-height: 1.3;

            font-weight: normal;

            color: #fff5f7;

            text-shadow:
                0 0 10px rgba(255, 80, 120, 0.5),
                0 0 30px rgba(255, 0, 60, 0.25);
        }


        /* Cursor for typing effect */

        .cursor {
            display: inline-block;

            width: 3px;

            height: 1em;

            margin-left: 5px;

            background: #ff4164;

            animation: blink 0.7s infinite;
        }


        @keyframes blink {

            0%, 50% {
                opacity: 1;
            }

            51%, 100% {
                opacity: 0;
            }
        }


        /* =========================
           BUTTONS
        ========================== */

        .buttons {
            margin-top: 35px;

            display: flex;

            justify-content: center;

            gap: 20px;

            opacity: 0;

            animation: fadeIn 2s ease 5.5s forwards;
        }


        button {
            position: relative;

            border: none;

            padding: 15px 40px;

            border-radius: 50px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }


        /* YES */

        #yesBtn {
            background: #b3002d;

            color: white;

            box-shadow:
                0 0 15px rgba(255, 0, 70, 0.4),
                0 0 35px rgba(255, 0, 70, 0.15);
        }


        #yesBtn:hover {
            transform: scale(1.12);

            background: #e0003d;

            box-shadow:
                0 0 20px rgba(255, 0, 70, 0.8),
                0 0 60px rgba(255, 0, 70, 0.4);
        }


        /* NO */

        #noBtn {
            background: transparent;

            color: #ffb5c4;

            border: 1px solid rgba(255, 150, 170, 0.4);
        }


        #noBtn:hover {
            transform: scale(1.05);

            border-color: #ff4164;

            color: white;
        }


        /* =========================
           ROMANTIC MESSAGE
        ========================== */

        .response {
            display: none;

            margin-top: 35px;

            font-size: clamp(22px, 4vw, 34px);

            line-height: 1.5;

            color: #ffb8c7;

            text-shadow:
                0 0 15px rgba(255, 50, 90, 0.6);

            animation: reveal 1.5s ease forwards;
        }


        .response .small {
            display: block;

            margin-top: 15px;

            font-size: 16px;

            color: rgba(255, 210, 220, 0.7);

            letter-spacing: 2px;
        }


        @keyframes reveal {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           FALLING HEARTS
        ========================== */

        .heart {
            position: fixed;

            top: -50px;

            z-index: 5;

            color: #ff315b;

            pointer-events: none;

            text-shadow:
                0 0 5px #ff315b,
                0 0 15px rgba(255, 30, 80, 0.8),
                0 0 30px rgba(255, 0, 60, 0.5);

            animation: fall linear forwards;
        }


        @keyframes fall {

            0% {
                transform:
                    translateY(-50px)
                    translateX(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {
                transform:
                    translateY(50vh)
                    translateX(30px)
                    rotate(180deg);
            }

            100% {
                transform:
                    translateY(110vh)
                    translateX(-30px)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================
           SCREEN FLASH WHEN YES
        ========================== */

        .love-flash {
            position: fixed;

            inset: 0;

            background: rgba(255, 0, 60, 0.18);

            opacity: 0;

            pointer-events: none;

            z-index: 20;
        }


        .love-flash.active {
            animation: flash 1.2s ease;
        }


        @keyframes flash {

            0% {
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        /* =========================
           FADE OUT
        ========================== */

        .fade-away {
            animation: fadeAway 1s ease forwards;
        }


        @keyframes fadeAway {

            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .container {
                width: 95%;
                padding: 20px;
            }

            .intro {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .question {
                min-height: 220px;
                font-size: 30px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                padding: 13px 28px;
                font-size: 16px;
            }

            .big-heart {
                font-size: 300px;
            }
        }

    </style>
</head>


<body>

    <!-- Big glowing heart behind everything -->

    <div class="big-heart">
        ♥
    </div>


    <!-- Flash effect -->

    <div class="love-flash" id="loveFlash"></div>


    <!-- Main content -->

    <main class="container" id="mainContent">

        <div class="intro">
            A little question
        </div>


        <div class="question">

            <span id="typedText"></span>

            <span class="cursor"></span>

        </div>


        <div class="buttons">

            <button id="yesBtn">
                Yes ❤️
            </button>

            <button id="noBtn">
                No
            </button>

        </div>


        <div class="response" id="response">

            Maybe some things are felt
            before they're said. ❤️

            <span class="small">
                And maybe this is one of them.
            </span>

        </div>

    </main>


    <script>

        /* =========================
           TYPEWRITER EFFECT
        ========================== */

        const question =
            "Do you think two people can sense the beginning of something before they dare to name it?";


        const typedText =
            document.getElementById("typedText");


        let index = 0;


        function typeQuestion() {

            if (index < question.length) {

                typedText.textContent += question.charAt(index);

                index++;

                setTimeout(typeQuestion, 55);

            }

        }


        // Start typing after a short pause

        setTimeout(typeQuestion, 1200);



        /* =========================
           YES BUTTON
        ========================== */

        const yesBtn =
            document.getElementById("yesBtn");


        const noBtn =
            document.getElementById("noBtn");


        const response =
            document.getElementById("response");


        const loveFlash =
            document.getElementById("loveFlash");


        yesBtn.addEventListener("click", function () {

            // Flash the screen

            loveFlash.classList.remove("active");

            void loveFlash.offsetWidth;

            loveFlash.classList.add("active");


            // Show romantic message

            response.style.display = "block";


            // Hide buttons

            document.querySelector(".buttons")
                .classList.add("fade-away");


            // Create an extra burst of hearts

            for (let i = 0; i < 25; i++) {

                setTimeout(createHeart, i * 50);

            }

        });



        /* =========================
           NO BUTTON
        ========================== */

        noBtn.addEventListener("click", function () {

            response.innerHTML = `
                Maybe you're not ready to name it yet. ❤️

                <span class="small">
                    That's okay. Some beginnings are quiet.
                </span>
            `;

            response.style.display = "block";

        });



        /* =========================
           FALLING HEART GENERATOR
        ========================== */

        function createHeart() {

            const heart =
                document.createElement("div");


            heart.classList.add("heart");


            // Different heart symbols

            const hearts = [
                "♥",
                "♡",
                "❤",
                "💕"
            ];


            heart.textContent =
                hearts[Math.floor(Math.random() * hearts.length)];


            // Random horizontal position

            heart.style.left =
                Math.random() * 100 + "vw";


            // Random size

            heart.style.fontSize =
                (12 + Math.random() * 24) + "px";


            // Random falling speed

            const duration =
                4 + Math.random() * 6;


            heart.style.animationDuration =
                duration + "s";


            // Slight random delay

            heart.style.animationDelay =
                Math.random() * 1.5 + "s";


            document.body.appendChild(heart);


            // Remove after animation

            setTimeout(function () {

                heart.remove();

            }, (duration + 2) * 1000);

        }



        /* =========================
           CONTINUOUS HEARTS
        ========================== */

        setInterval(function () {

            createHeart();

        }, 300);


    </script>

</body>
</html>
